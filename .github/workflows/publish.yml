name: Publish

on:
    push:
        branches: [main]
        # Narrowed from '**/package.json' to package manifests only: a real
        # release signal is a version edit under packages/<pkg>/package.json.
        # Root/devDep manifest churn (dependabot, tooling) must NOT start the
        # OIDC-minting publish job. (Sapper M2 H1 / STALE-4.)
        paths:
            - 'packages/*/package.json'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24
            - run: npm ci --ignore-scripts
            - run: npm run build
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: build-output
                  path: packages/*/dist/
                  retention-days: 1
                  if-no-files-found: error

    publish:
        needs: build
        runs-on: ubuntu-latest
        # Environment gate: the OIDC mint (id-token: write) is fronted by the
        # 'npm-publish' deployment environment, whose protection rule (required
        # reviewer / wait timer) gates the token mint behind a human/policy
        # checkpoint. (Sapper M2 H1 / STALE-4.)
        environment: npm-publish
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@script-development'
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: build-output
                  path: packages
            - run: npm ci --ignore-scripts
            # Pre-publish dist validation. Shares scripts/validate-dist.mjs with the
            # PR-time gate in ci.yml — single source of truth, so the release-time and
            # PR-time assertions cannot drift. Refuses to publish empty or incomplete
            # tarballs (fs-http 0.1.1/0.1.2 empty-tarball class).
            - run: npm run validate:dist
            - run: npx changeset publish
              env:
                  NPM_CONFIG_PROVENANCE: 'true'
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
