version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          oxc:
              patterns:
                  - 'oxlint'
                  - 'oxfmt'
          stryker:
              patterns:
                  - '@stryker-mutator/*'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
      ignore:
          # @types/node major tracks the Node runtime major (24: engines + setup-node).
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # 3.3.12/3.3.13 carry the codegen regression vuejs/language-tools#6237 (fix #6238 unmerged; WR-2176).
          - dependency-name: 'vue-component-type-helpers'
            versions: ['3.3.12', '3.3.13']
      open-pull-requests-limit: 10

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
